## This config enables Heimdall to work behind HA's ingress proxy.
## It is injected into /config/nginx/site-confs/ on first boot.

server {
    listen 80 default_server;
    listen 443 ssl default_server;

    server_name _;

    root /app/www/public;
    index index.html index.htm index.php;

    ssl_certificate /config/keys/cert.crt;
    ssl_certificate_key /config/keys/cert.key;

    client_max_body_size 0;

    # Handle HA ingress subpath
    # HA sends X-Ingress-Path header with the base path
    set $ingress_path "";
    if ($http_x_ingress_path) {
        set $ingress_path $http_x_ingress_path;
    }

    # Rewrite asset paths for ingress
    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript;
    sub_filter 'href="/' 'href="$ingress_path/';
    sub_filter 'src="/' 'src="$ingress_path/';
    sub_filter 'action="/' 'action="$ingress_path/';
    sub_filter 'url(/' 'url($ingress_path/';

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
